name: Unified CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests

    - name: Run Pipeline Smoke Test
      run: |
        pytest tests/test_pipeline.py -v

    - name: Run CPP Unit Tests
      run: |
        pytest tests/test_cpp_gate.py -v

    - name: Run System Eval (mock)
      run: |
        python tests/evaluate_system.py --mock

    - name: Run ReMindRAG Suite
      run: |
        # Placeholder for ReMindRAG 26-test suite
        # pytest test_benchmark_smoke.py test_repro_variance.py
        echo "Running ReMindRAG suite..."

    - name: Pass-Rate Gate
      run: |
        # Aggregate across all suites; check if >= 70% overall
        echo "Evaluating overall pass rate >= 70% gate..."
